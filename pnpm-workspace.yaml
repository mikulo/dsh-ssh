# Local development settings for this single-package repo. Consumers install
# the plugin with `dsh plugin --profile <name> add github:mikulo/dsh-ssh` and
# use the committed lib/ directly; nothing here runs on their machine.

# SDK peers are supplied by the DSH profile tree at runtime.
autoInstallPeers: false

allowBuilds:
  esbuild: true
  ssh2: true
  # Optional native speed-up for ssh2; needs a C++ toolchain and is safe to skip.
  cpu-features: false
